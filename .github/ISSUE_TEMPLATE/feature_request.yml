name: Feature request
description: Propose an improvement to SWF
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this proposal.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should SWF solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior and how success could be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workflow and orchestration
        - CLI
        - Service and persistence
        - Dashboard
        - Harness integration
        - Packaging and release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Note any expected configuration, state, API, or workflow compatibility implications.
